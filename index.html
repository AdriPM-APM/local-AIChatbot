<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Local AI Character Chat</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Mock Ad Banner -->
    <div id="ad-banner" class="ad-banner" role="complementary" aria-label="Advertisement">
        <div class="ad-content" onclick="console.log('Ad clicked')">
            📢 Ad space — click to test
        </div>
        <button id="close-ad" class="ad-close" aria-label="Close ad banner">✕</button>
    </div>

    <!-- App Layout -->
    <div class="app-container">
        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <h1>Hubs</h1>
                <button id="add-char-btn" class="icon-btn" aria-label="Add Character">+</button>
            </div>
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="Search characters...">
            </div>
            <div id="character-list" class="character-list">
                <!-- Character cards inserted here -->
            </div>
            <div class="sidebar-footer">
                <button id="settings-btn" class="text-btn">⚙️ Settings</button>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-area">
            <div id="chat-header" class="chat-header">
                <div class="char-info">
                    <img id="chat-avatar" src="" alt="Avatar" class="chat-avatar hidden">
                    <h2 id="chat-name">Select a Character</h2>
                </div>
                <button id="clear-chat-btn" class="text-btn hidden">Clear Chat</button>
            </div>
            <div id="messages-container" class="messages-container">
                <div class="empty-state">Select or create a character to start chatting.</div>
            </div>
            <div class="input-area">
                <textarea id="message-input" placeholder="Type a message..." rows="1" disabled></textarea>
                <button id="send-btn" class="send-btn" disabled>➤</button>
            </div>
        </main>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Settings</h2>
                <button class="close-modal-btn" data-modal="settings-modal">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Provider</label>
                    <select id="provider-select">
                        <option value="openrouter">OpenRouter</option>
                        <option value="gemini">Google Gemini</option>
                        <option value="openai">OpenAI</option>
                        <option value="anthropic">Anthropic Claude</option>
                        <option value="groq">Groq</option>
                        <option value="ollama">Ollama (Local)</option>
                        <option value="custom">Custom (OpenAI Compatible)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>API Key</label>
                    <input type="password" id="api-key-input" placeholder="sk-...">
                    <small>🔒 Stored locally in your browser only.</small>
                </div>
                <div class="form-group">
                    <label>Model Name</label>
                    <input type="text" id="model-input" placeholder="e.g. google/gemma-2-9b-it:free">
                </div>
                <div class="form-group" id="base-url-group" style="display:none;">
                    <label>Base URL (Custom)</label>
                    <input type="text" id="base-url-input" placeholder="https://api.example.com/v1">
                </div>
                <div class="form-group toggle-group">
                    <label>Show Ads</label>
                    <label class="switch">
                        <input type="checkbox" id="show-ads-toggle" checked>
                        <span class="slider round"></span>
                    </label>
                </div>
                <div class="form-actions">
                    <button id="save-settings-btn" class="primary-btn">Save Locally</button>
                    <button id="clear-data-btn" class="danger-btn">Clear All Data</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Character Creation Modal -->
    <div id="character-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Create Character</h2>
                <button class="close-modal-btn" data-modal="character-modal">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Avatar</label>
                    <input type="file" id="char-avatar" accept="image/*">
                </div>
                <div class="form-group">
                    <label>Name *</label>
                    <input type="text" id="char-name" required placeholder="Character Name">
                </div>
                <div class="form-group">
                    <label>Gender</label>
                    <select id="char-gender">
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Non-binary">Non-binary</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Intro (Short Tagline)</label>
                    <textarea id="char-intro" rows="2" placeholder="A brief description..."></textarea>
                </div>
                <div class="form-group">
                    <label>Greetings (First Message)</label>
                    <textarea id="char-greetings" rows="3" placeholder="Hello there!"></textarea>
                </div>
                <div class="form-group">
                    <label>Backstory</label>
                    <textarea id="char-backstory" rows="5" placeholder="Detailed history and personality..."></textarea>
                </div>
                <div class="form-group toggle-group">
                    <label>Private Only</label>
                    <label class="switch">
                        <input type="checkbox" id="char-private">
                        <span class="slider round"></span>
                    </label>
                </div>
                <div class="form-group">
                    <label>Tags (comma separated)</label>
                    <input type="text" id="char-tags" placeholder="fantasy, sci-fi, assistant">
                </div>
                <div class="form-actions">
                    <button id="save-char-btn" class="primary-btn">Save Character</button>
                    <label for="import-png" class="secondary-btn">Import from PNG</label>
                    <input type="file" id="import-png" accept=".png" style="display:none;">
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <script src="app.js"></script>
</body>
</html>
