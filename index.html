<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local AI Chatbot</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar Banner / Panel -->
        <aside id="sidebar-banner" class="sidebar">
            <div class="sidebar-header">
                <h3>Sidebar Banner</h3>
                <button id="sidebar-toggle-btn" class="icon-btn" title="Toggle Sidebar">☰</button>
            </div>
            <div class="sidebar-content">
                <p>Welcome to your local AI assistant.</p>
                <div class="setting-group">
                    <label for="popunder-toggle">Popunder Active:</label>
                    <label class="switch">
                        <input type="checkbox" id="popunder-toggle" checked>
                        <span class="slider round"></span>
                    </label>
                </div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="main-content">
            <header class="chat-header">
                <h2>AI Chatbot</h2>
                <button id="popunder-trigger" class="action-btn">Open Popunder</button>
            </header>
            
            <div id="chat-window" class="chat-window">
                <div class="message bot-message">
                    <p>Hello! How can I help you today?</p>
                </div>
            </div>

            <div class="chat-input-area">
                <input type="text" id="user-input" placeholder="Type your message here...">
                <button id="send-btn">Send</button>
            </div>
        </main>
    </div>

    <!-- Popunder Window -->
    <div id="popunder-modal" class="popunder-modal hidden">
        <div class="popunder-content">
            <div class="popunder-header">
                <h3>Quick Popunder</h3>
                <button id="close-popunder-btn" class="close-x">&times;</button>
            </div>
            <div class="popunder-body">
                <p>This is your quick access popunder window.</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
